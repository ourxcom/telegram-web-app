<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ishlab chiqarish formasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --tg-bg: var(--tg-theme-bg-color, #ffffff);
    --tg-text: var(--tg-theme-text-color, #1a1a1a);
    --tg-hint: var(--tg-theme-hint-color, #8a8a8e);
    --tg-link: var(--tg-theme-link-color, #2481cc);
    --tg-btn: var(--tg-theme-button-color, #2481cc);
    --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
    --tg-secbg: var(--tg-theme-secondary-bg-color, #f0f0f3);
    --accent-danger: #e0483e;
    --accent-ok: #2ecc71;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--tg-bg); color:var(--tg-text);
    padding-bottom:90px;
  }
  header{
    padding:16px; position:sticky; top:0; background:var(--tg-bg); z-index:10;
    border-bottom:1px solid var(--tg-secbg);
    display:flex; align-items:center; gap:10px;
  }
  header h1{font-size:17px; margin:0; flex:1;}
  .back-btn{
    background:none; border:none; color:var(--tg-link); font-size:16px; cursor:pointer; padding:4px 0;
  }
  main{padding:16px;}
  .card{
    background:var(--tg-secbg); border-radius:14px; padding:14px 16px;
    margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; transition:transform .1s;
  }
  .card:active{transform:scale(0.98);}
  .card .title{font-size:15px; font-weight:600;}
  .card .chevron{color:var(--tg-hint); font-size:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--tg-hint); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--tg-secbg);
    background:var(--tg-secbg); color:var(--tg-text); font-size:15px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .section-title{
    font-size:13px; font-weight:700; text-transform:uppercase; color:var(--tg-hint);
    margin:20px 0 8px; letter-spacing:.4px;
  }
  .footer-bar{
    position:fixed; bottom:0; left:0; right:0; padding:12px 16px;
    background:var(--tg-bg); border-top:1px solid var(--tg-secbg);
  }
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:12px;
    background:var(--tg-btn); color:var(--tg-btn-text); font-size:16px; font-weight:600;
    cursor:pointer;
  }
  .btn-primary:disabled{opacity:.5;}
  .msg{
    padding:12px 14px; border-radius:10px; font-size:14px; margin-bottom:14px;
  }
  .msg-error{background:rgba(224,72,62,.12); color:var(--accent-danger);}
  .msg-ok{background:rgba(46,204,113,.12); color:#1a9c53;}
  .hidden{display:none !important;}
  .center-msg{text-align:center; padding:60px 20px; color:var(--tg-hint); font-size:14px;}
  .op-info{font-size:13px; color:var(--tg-hint); margin-bottom:16px;}
  .reg-form input{margin-bottom:12px;}
</style>
</head>
<body>

<header>
  <button class="back-btn hidden" id="backBtn">‹ Orqaga</button>
  <h1 id="headerTitle">Ishlab chiqarish</h1>
</header>

<main id="app">
  <div class="center-msg" id="loadingMsg">Yuklanmoqda...</div>
</main>

<div class="footer-bar hidden" id="footerBar">
  <button class="btn-primary" id="submitBtn">Saqlash</button>
</div>

<script>
// ====== SOZLAMALAR ======
const API_URL = "https://script.google.com/macros/s/AKfycbyLzPlbcSEFqgG_RAm8GdGnQivJ_YAjJPW1OW3IwSoFxe8RniWoiyAuKJC3tmh91d_e/exec";

// ====== TELEGRAM SDK ======
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const telegramId = tgUser ? tgUser.id : (new URLSearchParams(location.search).get("test_id") || "TEST_USER");
const telegramUsername = tgUser ? (tgUser.username || "") : "";

// ====== HOLAT ======
let bootstrap = null; // {operator, mahsulotlar, tuxtalishSabablari, jarayonlar}
let currentJarayon = null;
let shiftState = null; // {sana, smena}
let shiftEntries = null; // null = hali yuklanmagan; [] = yuklangan, bo'sh

const SHIFT_KEY = "wms_shift_v1";
function loadShift() {
  try {
    const raw = localStorage.getItem(SHIFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveShift(s) { localStorage.setItem(SHIFT_KEY, JSON.stringify(s)); }
function clearShift() { localStorage.removeItem(SHIFT_KEY); }

// Har bir jarayon uchun forma maydonlari tavsifi
// type: text | date | select | number | time
const FORM_DEFS = {
  "Гранулятор": [
    {k:"polProdukt", label:"Пол.Продукт", type:"select", options:["Марка ППГ","Марка ПЭГ"]},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"edIzm", label:"Ед. изм", type:"text", def:"кг"},
    {k:"fakt", label:"Факт", type:"number"},
    {k:"brakLitnik", label:"Брак литник", type:"number"},
    {k:"brakKukun", label:"Брак кукун", type:"number"},
    {k:"tDan", label:"Т ..Дан", type:"time"},
    {k:"tGacha", label:"Т ..Гача", type:"time"},
    {k:"tuxtalish", label:"Тўхталиш", type:"tuxtalish"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ],
  "Мотан": [
    {k:"polProdukt", label:"Пол.Продукт", type:"select", options:["Марка ППГ","Марка ПЭГ"]},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"edIzm", label:"Ед. изм", type:"text", def:"кг"},
    {k:"fakt", label:"Факт", type:"number"},
    {k:"tDan", label:"Т ..Дан", type:"time"},
    {k:"tGacha", label:"Т ..Гача", type:"time"},
    {k:"tuxtalish", label:"Тўхталиш", type:"tuxtalish"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ],
  "Приготовление раствор": [
    {k:"naimenovanie", label:"Наименование", type:"mahsulot"},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"fakt", label:"Факт", type:"number"},
    {k:"seriyaBoshlanishi", label:"Серия бошланиши", type:"time"},
    {k:"seriyaTugashi", label:"Серия тугаши", type:"time"},
    {k:"brak", label:"Брак", type:"number"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ],
  "Дозатор": [
    {k:"naimenovanie", label:"Наименование", type:"mahsulot"},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"lot", label:"Лот", type:"select", options:["А","Б","С","Д"]},
    {k:"edIzm", label:"Ед. изм", type:"select", options:["А","П 10","П 50"]},
    {k:"faktDoz", label:"Факт Доз", type:"number"},
    {k:"brakOkk", label:"Брак окк.", type:"number"},
    {k:"brakAmp", label:"Брак амп.", type:"number"},
    {k:"lotBoshiDan", label:"Лот боши ...дан", type:"number"},
    {k:"lotOxiriGacha", label:"Лот охири ...гача", type:"number"},
    {k:"tDan", label:"Т ..дан", type:"time"},
    {k:"tGacha", label:"Т ..гача", type:"time"},
    {k:"tuxtalish", label:"Тўхталиш", type:"tuxtalish"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ],
  "Стерилизация": [
    {k:"naimenovanie", label:"Наименование", type:"mahsulot"},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"lot", label:"Лот", type:"select", options:["А","Б","С","Д"]},
    {k:"fakt", label:"Факт", type:"number"},
    {k:"lotBoshiDan", label:"Лот боши ...дан", type:"number"},
    {k:"lotOxiriGacha", label:"Лот охири ...гача", type:"number"},
    {k:"tDan", label:"Т ..дан", type:"time"},
    {k:"tGacha", label:"Т ..гача", type:"time"},
    {k:"tuxtalish", label:"Тўхталиш", type:"tuxtalish"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ],
  "Упаковка": [
    {k:"naimenovanie", label:"Наименование", type:"mahsulot"},
    {k:"seriya", label:"Серия", type:"text"},
    {k:"lot", label:"Лот", type:"select", options:["А","Б","С","Д"]},
    {k:"edIzm", label:"Ед. изм", type:"select", options:["А","П 10","П 50"]},
    {k:"qadoqTuri", label:"Қадоқ тури", type:"select", options:["ГП","In bulk","Доупак"]},
    {k:"fakt", label:"Факт", type:"number"},
    {k:"gofra", label:"Гофра (Склад карантин)", type:"number"},
    {k:"brakAmp", label:"Брак амп.", type:"number"},
    {k:"brakMex", label:"Брак мех.", type:"number"},
    {k:"brakDoza", label:"Брак доза.", type:"number"},
    {k:"brakUtechka", label:"Брак утечка.", type:"number"},
    {k:"brakInst", label:"Брак инст", type:"number"},
    {k:"brakGof", label:"Брак гоф", type:"number"},
    {k:"brakGrEt", label:"Брак гр.эт", type:"number"},
    {k:"lotBoshiDan", label:"Лот боши ...дан", type:"number"},
    {k:"lotOxiriGacha", label:"Лот охири ...гача", type:"number"},
    {k:"tDan", label:"Т ..дан", type:"time"},
    {k:"tGacha", label:"Т ..гача", type:"time"},
    {k:"tuxtalish", label:"Тўхталиш", type:"tuxtalish"},
    {k:"primechanie", label:"Примечание", type:"textarea"}
  ]
};

const app = document.getElementById("app");
const headerTitle = document.getElementById("headerTitle");
const backBtn = document.getElementById("backBtn");
const footerBar = document.getElementById("footerBar");
const submitBtn = document.getElementById("submitBtn");

backBtn.onclick = () => renderMenu();

function todayParts() {
  const d = new Date();
  return { dd: d.getDate(), mm: d.getMonth()+1, yyyy: d.getFullYear() };
}
// Sana endi "dd.mm.yyyy" ko'rinishidagi oddiy MATN sifatida saqlanadi — hech qanday
// Date obyekti yoki native <input type="date"> ishlatilmaydi, shuning uchun
// timezone yoki WebView'ga xos konvertatsiya xatolari butunlay yo'q qilinadi.
function formatSanaDisplay(sana) { return sana; } // allaqachon "dd.mm.yyyy" ko'rinishida

async function apiGet(params) {
  const url = API_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // preflightsiz yuborish uchun
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function init() {
  if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
    app.innerHTML = `<div class="msg msg-error">API_URL sozlanmagan. index.html faylida API_URL o'zgaruvchisiga Apps Script Web App manzilini kiriting.</div>`;
    return;
  }
  shiftState = loadShift();
  // Smena allaqachon tanlangan bo'lsa, bitta so'rovda operator + statik ro'yxatlar +
  // joriy smena yozuvlarini birga olamiz (2 ta alohida so'rov o'rniga 1 ta — tezroq).
  const params = { action: "bootstrap", telegramId };
  if (shiftState) { params.sana = shiftState.sana; params.smena = shiftState.smena; }
  const data = await apiGet(params);
  if (!data.ok) {
    app.innerHTML = `<div class="msg msg-error">${data.error || "Xatolik yuz berdi"}</div>`;
    return;
  }
  bootstrap = data;
  if (!bootstrap.operator) {
    renderRegister();
    return;
  }
  if (!shiftState) {
    renderShiftStart();
  } else {
    shiftEntries = data.entries || [];
    renderMenu();
  }
}

function renderRegister() {
  headerTitle.textContent = "Ro'yxatdan o'tish";
  backBtn.classList.add("hidden");
  footerBar.classList.add("hidden");
  app.innerHTML = `
    <div class="msg msg-error">Siz hali ro'yxatdan o'tmagansiz. Таб.номерингizni kiriting — u Operatorlar ro'yxatida oldindan mavjud bo'lishi kerak.</div>
    <div class="reg-form">
      <div class="field">
        <label>Таб.номер</label>
        <input type="number" id="regTabNo" placeholder="masalan: 6721">
      </div>
    </div>
    <button class="btn-primary" id="regBtn">Ro'yxatdan o'tish</button>
  `;
  document.getElementById("regBtn").onclick = async () => {
    const tabNo = document.getElementById("regTabNo").value.trim();
    if (!tabNo) return;
    const res = await apiPost({ action: "register", tabNo, telegramId, telegramUsername });
    if (res.ok) {
      init();
    } else {
      alert(res.error || "Xatolik");
    }
  };
}

function renderShiftStart() {
  headerTitle.textContent = "Smenani boshlash";
  backBtn.classList.add("hidden");
  footerBar.classList.add("hidden");
  const t = todayParts();
  const kunOptions = Array.from({length:31}, (_,i)=>i+1)
    .map(d => `<option value="${d}" ${d===t.dd?"selected":""}>${d}</option>`).join("");
  const oyNomlari = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
  const oyOptions = oyNomlari.map((n,i) => `<option value="${i+1}" ${(i+1)===t.mm?"selected":""}>${n}</option>`).join("");
  const yilOptions = [t.yyyy-1, t.yyyy, t.yyyy+1].map(y => `<option value="${y}" ${y===t.yyyy?"selected":""}>${y}</option>`).join("");

  app.innerHTML = `
    <div class="op-info">${bootstrap.operator.fio} · ${bootstrap.operator.profession}</div>
    <div class="field">
      <label>Sana</label>
      <div class="row2" style="grid-template-columns:1fr 1.4fr 1fr;">
        <select id="shiftKun">${kunOptions}</select>
        <select id="shiftOy">${oyOptions}</select>
        <select id="shiftYil">${yilOptions}</select>
      </div>
    </div>
    <div class="field">
      <label>Смена</label>
      <select id="shiftSmena">
        <option value="">— tanlang —</option>
        <option value="А">А</option>
        <option value="Б">Б</option>
        <option value="С">С</option>
        <option value="Д">Д</option>
      </select>
    </div>
    <button class="btn-primary" id="startShiftBtn">Boshlash</button>
  `;
  document.getElementById("startShiftBtn").onclick = () => {
    const kun = document.getElementById("shiftKun").value.padStart(2,"0");
    const oy = document.getElementById("shiftOy").value.padStart(2,"0");
    const yil = document.getElementById("shiftYil").value;
    const smena = document.getElementById("shiftSmena").value;
    if (!smena) {
      alert("Смена tanlanishi shart.");
      return;
    }
    const sana = `${kun}.${oy}.${yil}`; // sof matn, hech qanday Date/timezone konvertatsiyasi yo'q
    shiftState = { sana, smena };
    saveShift(shiftState);
    shiftEntries = []; // yangi smena — hali yozuv yo'q, server so'rovi shart emas
    renderMenu();
  };
}

async function refreshShiftEntries() {
  const res = await apiGet({ action: "shiftEntries", telegramId, sana: shiftState.sana, smena: shiftState.smena });
  shiftEntries = res.ok ? res.entries : [];
}

function countFor(jarayon) {
  return (shiftEntries || []).filter(e => e.jarayon === jarayon).length;
}

async function renderMenu() {
  currentJarayon = null;
  headerTitle.textContent = "Jarayonni tanlang";
  backBtn.classList.add("hidden");
  footerBar.classList.add("hidden");
  if (shiftEntries === null) {
    app.innerHTML = `<div class="center-msg">Yuklanmoqda...</div>`;
    await refreshShiftEntries();
  }

  const jarayonlar = bootstrap.operator.jarayonlar.length ? bootstrap.operator.jarayonlar : bootstrap.jarayonlar;
  const totalCount = shiftEntries.length;
  const reopenedCount = (bootstrap.reopenedEdits || []).length;
  const pendingCount = (bootstrap.pendingRequests || []).length;

  app.innerHTML = `
    <div class="op-info">${bootstrap.operator.fio} · ${bootstrap.operator.profession}</div>
    <div class="op-info" style="margin-top:-10px;">📅 ${formatSanaDisplay(shiftState.sana)} · Смена ${shiftState.smena}
      <a href="#" id="changeShiftLink" style="margin-left:8px;">(o'zgartirish)</a>
    </div>
    <div id="menuList"></div>
    <div class="section-title">Smenani yakunlash</div>
    <div class="card" id="reviewCard">
      <span class="title">Ma'lumotlarni ko'rib chiqish va tasdiqlash</span>
      <span class="chevron">${totalCount} ta ›</span>
    </div>
    ${reopenedCount ? `
    <div class="section-title">Tahrirlash</div>
    <div class="card" id="reopenedCard">
      <span class="title">🔓 Ochilgan tahrirlar</span>
      <span class="chevron">${reopenedCount} ta ›</span>
    </div>` : ""}
    <div class="section-title">Tarix</div>
    <div class="card" id="historyCard">
      <span class="title">🕘 Tasdiqlangan yozuvlarni ko'rish / tahrirlash so'rash</span>
      <span class="chevron">›</span>
    </div>
    ${bootstrap.isAdmin ? `
    <div class="section-title">Admin</div>
    <div class="card" id="adminCard">
      <span class="title">🛡 Admin panel</span>
      <span class="chevron">${pendingCount} ta so'rov ›</span>
    </div>` : ""}
  `;
  const list = document.getElementById("menuList");
  jarayonlar.forEach(j => {
    const c = countFor(j);
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<span class="title">${j}</span><span class="chevron">${c ? c + " ta · " : ""}›</span>`;
    div.onclick = () => renderForm(j);
    list.appendChild(div);
  });
  document.getElementById("reviewCard").onclick = () => renderReview();
  if (reopenedCount) document.getElementById("reopenedCard").onclick = () => renderReopenedList();
  document.getElementById("historyCard").onclick = () => renderHistoryPicker();
  if (bootstrap.isAdmin) document.getElementById("adminCard").onclick = () => renderAdminPanel();
  document.getElementById("changeShiftLink").onclick = (e) => {
    e.preventDefault();
    if (confirm("Smenani o'zgartirish hozirgacha kiritilgan yozuvlarga ta'sir qilmaydi, faqat yangi yozuvlar uchun yangi sana/smena ishlatiladi. Davom etasizmi?")) {
      clearShift();
      shiftState = null;
      shiftEntries = null;
      renderShiftStart();
    }
  };
}

function renderForm(jarayon) {
  currentJarayon = jarayon;
  headerTitle.textContent = jarayon;
  backBtn.classList.remove("hidden");
  footerBar.classList.remove("hidden");
  backBtn.onclick = () => renderMenu();
  const defs = FORM_DEFS[jarayon];
  let html = `<div class="op-info">📅 ${formatSanaDisplay(shiftState.sana)} · Смена ${shiftState.smena}</div><div id="formMsg"></div>`;
  defs.forEach(f => {
    html += renderField(f);
  });
  app.innerHTML = html;

  submitBtn.textContent = "Saqlash";
  submitBtn.onclick = () => submitCurrentForm(defs);
}

function renderReview() {
  headerTitle.textContent = "Ko'rib chiqish va tasdiqlash";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderMenu();
  footerBar.classList.remove("hidden");

  if (shiftEntries.length === 0) {
    app.innerHTML = `<div class="center-msg">Hali hech qanday yozuv kiritilmagan.</div>`;
    footerBar.classList.add("hidden");
    return;
  }

  let html = `<div class="op-info">📅 ${formatSanaDisplay(shiftState.sana)} · Смена ${shiftState.smena} · Jami: ${shiftEntries.length} ta yozuv</div>`;
  shiftEntries.forEach((entry, idx) => {
    const defs = FORM_DEFS[entry.jarayon];
    const parts = defs
      .filter(f => entry.fields[f.k] !== "" && entry.fields[f.k] !== undefined)
      .map(f => `<b>${f.label}:</b> ${entry.fields[f.k]}`)
      .join(" · ");
    html += `
      <div class="card" style="flex-direction:column; align-items:stretch; cursor:default;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span class="title">${entry.jarayon}</span>
          <span>
            <button data-idx="${idx}" class="editEntryBtn" style="background:none;border:none;color:var(--tg-link);font-size:13px;cursor:pointer;margin-right:10px;">Tahrirlash</button>
            <button data-idx="${idx}" class="delEntryBtn" style="background:none;border:none;color:var(--accent-danger);font-size:13px;cursor:pointer;">O'chirish</button>
          </span>
        </div>
        <div style="font-size:13px; color:var(--tg-hint); line-height:1.5;">${parts}</div>
      </div>
    `;
  });
  app.innerHTML = html;

  document.querySelectorAll(".editEntryBtn").forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const entry = shiftEntries[idx];
      renderEditForm(entry.jarayon, entry.yozuvId, entry.fields, () => renderReview());
    };
  });

  document.querySelectorAll(".delEntryBtn").forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      const entry = shiftEntries[idx];
      if (!confirm(`${entry.jarayon} yozuvini o'chirishni tasdiqlaysizmi?`)) return;
      const res = await apiPost({ action: "deleteEntry", telegramId, jarayon: entry.jarayon, yozuvId: entry.yozuvId });
      if (res.ok) {
        shiftEntries = shiftEntries.filter(e => e.yozuvId !== entry.yozuvId); // serverga qayta murojaat qilmay, mahalliy yangilaymiz
        renderReview();
      } else {
        alert(res.error || "Xatolik");
      }
    };
  });

  submitBtn.textContent = "Smenani tasdiqlash (" + shiftEntries.length + " ta)";
  submitBtn.onclick = async () => {
    if (!confirm("Barcha yozuvlarni tasdiqlaysizmi? Tasdiqlangandan keyin ularni o'zgartirib/o'chirib bo'lmaydi.")) return;
    submitBtn.disabled = true;
    const res = await apiPost({ action: "confirmShift", telegramId, sana: shiftState.sana, smena: shiftState.smena });
    submitBtn.disabled = false;
    if (res.ok) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      alert(res.count + " ta yozuv tasdiqlandi. Smena yakunlandi.");
      clearShift();
      shiftState = null;
      shiftEntries = null;
      renderShiftStart();
    } else {
      alert(res.error || "Xatolik");
    }
  };
}

function renderField(f, def) {
  const id = "f_" + f.k;
  const dv = def !== undefined && def !== null ? def : "";
  if (f.type === "select") {
    const opts = f.options.map(o => `<option value="${o}" ${String(o)===String(dv)?"selected":""}>${o}</option>`).join("");
    return `<div class="field"><label>${f.label}</label><select id="${id}"><option value="">—</option>${opts}</select></div>`;
  }
  if (f.type === "mahsulot") {
    const opts = bootstrap.mahsulotlar.map(o => `<option value="${o}" ${String(o)===String(dv)?"selected":""}>${o}</option>`).join("");
    return `<div class="field"><label>${f.label}</label><select id="${id}"><option value="">— tanlang —</option>${opts}</select></div>`;
  }
  if (f.type === "tuxtalish") {
    const opts = bootstrap.tuxtalishSabablari.map(o => `<option value="${o.nomi}" ${String(o.nomi)===String(dv)?"selected":""}>${o.nomi}</option>`).join("");
    return `<div class="field"><label>${f.label}</label><select id="${id}"><option value="">—</option>${opts}</select></div>`;
  }
  if (f.type === "textarea") {
    return `<div class="field"><label>${f.label}</label><textarea id="${id}">${dv}</textarea></div>`;
  }
  if (f.type === "time") {
    return `<div class="field"><label>${f.label}</label><input type="time" id="${id}" value="${dv}"></div>`;
  }
  if (f.type === "number") {
    return `<div class="field"><label>${f.label}</label><input type="number" inputmode="decimal" id="${id}" value="${dv}"></div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" id="${id}" value="${dv || f.def || ""}"></div>`;
}

async function submitCurrentForm(defs, confirmDuplicate) {
  const msgEl = document.getElementById("formMsg");
  msgEl.innerHTML = "";
  const fields = { sana: shiftState.sana, smena: shiftState.smena };
  for (const f of defs) {
    const el = document.getElementById("f_" + f.k);
    fields[f.k] = el.value;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = "Saqlanmoqda...";
  try {
    const res = await apiPost({
      action: "submit",
      telegramId,
      jarayon: currentJarayon,
      fields,
      confirmDuplicate: !!confirmDuplicate
    });
    if (res.ok) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      msgEl.innerHTML = `<div class="msg msg-ok">Saqlandi ✓ Yana yozuv kiritishingiz mumkin.</div>`;
      shiftEntries = (shiftEntries || []).concat([{ jarayon: currentJarayon, yozuvId: res.rowId, fields: fields }]); // mahalliy hisoblagichni yangilaymiz — qayta so'rov shart emas
      defs.forEach(f => {
        const el = document.getElementById("f_" + f.k);
        if (el) el.value = "";
      });
    } else if (res.duplicate) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
      askDuplicateConfirm(res.error, () => submitCurrentForm(defs, true));
      msgEl.innerHTML = "";
    } else {
      msgEl.innerHTML = `<div class="msg msg-error">${res.error || "Xatolik yuz berdi"}</div>`;
    }
  } catch (err) {
    msgEl.innerHTML = `<div class="msg msg-error">Tarmoq xatosi: ${err}</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Saqlash";
  }
}

function askDuplicateConfirm(message, onConfirm) {
  if (tg && tg.showConfirm) {
    tg.showConfirm(message, (confirmed) => { if (confirmed) onConfirm(); });
  } else {
    if (window.confirm(message)) onConfirm();
  }
}

/**
 * Mavjud yozuvni tahrirlash formasi. Ikki holatda ishlatiladi:
 *  - Hali tasdiqlanmagan yozuv (review ekranidan "Tahrirlash")
 *  - Admin tomonidan qayta ochilgan (tasdiqlangan bo'lgan) yozuv ("Ochilgan tahrirlar")
 * onBack — orqaga qaytilganda chaqiriladigan funksiya.
 */
function renderEditForm(jarayon, yozuvId, existingFields, onBack) {
  currentJarayon = jarayon;
  headerTitle.textContent = "Tahrirlash: " + jarayon;
  backBtn.classList.remove("hidden");
  footerBar.classList.remove("hidden");
  backBtn.onclick = onBack;
  const defs = FORM_DEFS[jarayon];
  let html = `<div class="op-info">📅 ${formatSanaDisplay(existingFields.sana)} · Смена ${existingFields.smena}</div><div id="formMsg"></div>`;
  defs.forEach(f => { html += renderField(f, existingFields[f.k]); });
  app.innerHTML = html;

  submitBtn.textContent = "Saqlash";
  submitBtn.onclick = async () => {
    const msgEl = document.getElementById("formMsg");
    msgEl.innerHTML = "";
    const fields = { sana: existingFields.sana, smena: existingFields.smena };
    defs.forEach(f => { fields[f.k] = document.getElementById("f_" + f.k).value; });
    submitBtn.disabled = true;
    submitBtn.textContent = "Saqlanmoqda...";
    try {
      const res = await apiPost({ action: "editEntry", telegramId, jarayon, yozuvId, fields });
      if (res.ok) {
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        // Mahalliy ro'yxatlarni yangilaymiz
        if (shiftEntries) {
          const idx = shiftEntries.findIndex(e => e.yozuvId === yozuvId);
          if (idx !== -1) shiftEntries[idx].fields = fields;
        }
        if (bootstrap.reopenedEdits) {
          bootstrap.reopenedEdits = bootstrap.reopenedEdits.filter(e => e.yozuvId !== yozuvId);
        }
        alert("Yozuv saqlandi.");
        onBack();
      } else {
        msgEl.innerHTML = `<div class="msg msg-error">${res.error || "Xatolik yuz berdi"}</div>`;
      }
    } catch (err) {
      msgEl.innerHTML = `<div class="msg msg-error">Tarmoq xatosi: ${err}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Saqlash";
    }
  };
}

/** Admin tomonidan qayta ochilgan (tahrirlash kutayotgan) yozuvlar ro'yxati */
async function renderReopenedList() {
  headerTitle.textContent = "Ochilgan tahrirlar";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderMenu();
  footerBar.classList.add("hidden");

  const list = bootstrap.reopenedEdits || [];
  if (list.length === 0) {
    app.innerHTML = `<div class="center-msg">Hozircha ochilgan tahrirlar yo'q.</div>`;
    return;
  }
  let html = "";
  list.forEach((item, idx) => {
    html += `
      <div class="card" data-idx="${idx}">
        <span class="title">${item.jarayon}</span>
        <span class="chevron">›</span>
      </div>
      <div style="font-size:12px; color:var(--tg-hint); margin:-6px 0 10px 4px;">Sabab: ${item.sabab || "-"}</div>
    `;
  });
  app.innerHTML = html;
  document.querySelectorAll(".card[data-idx]").forEach(card => {
    card.onclick = async () => {
      const idx = Number(card.dataset.idx);
      const item = list[idx];
      app.innerHTML = `<div class="center-msg">Yuklanmoqda...</div>`;
      const res = await apiGet({ action: "entry", telegramId, jarayon: item.jarayon, yozuvId: item.yozuvId });
      if (!res.ok) { alert(res.error || "Yozuv topilmadi"); renderReopenedList(); return; }
      renderEditForm(item.jarayon, item.yozuvId, res.fields, () => renderReopenedList());
    };
  });
}

/** Operator o'z jarayonini tanlab, tasdiqlangan yozuvlarini ko'rish uchun */
function renderHistoryPicker() {
  headerTitle.textContent = "Tarix";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderMenu();
  footerBar.classList.add("hidden");

  const jarayonlar = bootstrap.operator.jarayonlar.length ? bootstrap.operator.jarayonlar : bootstrap.jarayonlar;
  let html = `
    <div class="field">
      <label>Sana bo'yicha filtr (ixtiyoriy, dd.mm.yyyy)</label>
      <input type="text" id="histSana" placeholder="masalan: 13.08.2026">
    </div>
    <div class="section-title">Jarayonni tanlang</div>
    <div id="histList"></div>
  `;
  app.innerHTML = html;
  const list = document.getElementById("histList");
  jarayonlar.forEach(j => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<span class="title">${j}</span><span class="chevron">›</span>`;
    div.onclick = () => renderHistoryList(j, document.getElementById("histSana").value.trim());
    list.appendChild(div);
  });
}

async function renderHistoryList(jarayon, sana) {
  headerTitle.textContent = jarayon + " — tarix";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderHistoryPicker();
  footerBar.classList.add("hidden");
  app.innerHTML = `<div class="center-msg">Yuklanmoqda...</div>`;

  const params = { action: "history", telegramId, jarayon };
  if (sana) params.sana = sana;
  const res = await apiGet(params);
  const entries = res.ok ? res.entries : [];
  if (entries.length === 0) {
    app.innerHTML = `<div class="center-msg">Tasdiqlangan yozuv topilmadi.</div>`;
    return;
  }
  const defs = FORM_DEFS[jarayon];
  let html = "";
  entries.forEach((entry, idx) => {
    const parts = defs
      .filter(f => entry.fields[f.k] !== "" && entry.fields[f.k] !== undefined)
      .map(f => `<b>${f.label}:</b> ${entry.fields[f.k]}`)
      .join(" · ");
    html += `
      <div class="card" style="flex-direction:column; align-items:stretch;" data-idx="${idx}">
        <div style="font-size:13px; color:var(--tg-hint); line-height:1.5;">${parts}</div>
      </div>
    `;
  });
  app.innerHTML = html;
  document.querySelectorAll(".card[data-idx]").forEach(card => {
    card.onclick = () => {
      const idx = Number(card.dataset.idx);
      renderRequestEditScreen(jarayon, entries[idx]);
    };
  });
}

function renderRequestEditScreen(jarayon, entry) {
  headerTitle.textContent = "Tahrirlashni so'rash";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderHistoryList(jarayon, "");
  footerBar.classList.remove("hidden");

  const defs = FORM_DEFS[jarayon];
  const parts = defs
    .filter(f => entry.fields[f.k] !== "" && entry.fields[f.k] !== undefined)
    .map(f => `<b>${f.label}:</b> ${entry.fields[f.k]}`)
    .join("<br>");
  app.innerHTML = `
    <div class="card" style="flex-direction:column; align-items:stretch; cursor:default;">
      <div style="font-size:13px; line-height:1.7;">${parts}</div>
    </div>
    <div id="formMsg"></div>
    <div class="field">
      <label>Nega o'zgartirish kerak? (sabab)</label>
      <textarea id="editSabab" placeholder="masalan: Факт miqdorda xatolik bor edi"></textarea>
    </div>
  `;
  submitBtn.textContent = "Adminga so'rov yuborish";
  submitBtn.onclick = async () => {
    const sabab = document.getElementById("editSabab").value.trim();
    const msgEl = document.getElementById("formMsg");
    if (!sabab) { msgEl.innerHTML = `<div class="msg msg-error">Sababni yozish shart.</div>`; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = "Yuborilmoqda...";
    const res = await apiPost({ action: "requestEdit", telegramId, jarayon, yozuvId: entry.yozuvId, sabab });
    submitBtn.disabled = false;
    submitBtn.textContent = "Adminga so'rov yuborish";
    if (res.ok) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      alert("So'rov yuborildi. Admin tasdiqlagach, \"Ochilgan tahrirlar\" bo'limida tuzatishingiz mumkin bo'ladi.");
      renderMenu();
    } else {
      msgEl.innerHTML = `<div class="msg msg-error">${res.error || "Xatolik yuz berdi"}</div>`;
    }
  };
}

/** Admin panel: ko'rib chiqilmagan tahrirlash so'rovlari, Tasdiqlash/Rad etish */
function renderAdminPanel() {
  headerTitle.textContent = "Admin panel";
  backBtn.classList.remove("hidden");
  backBtn.onclick = () => renderMenu();
  footerBar.classList.add("hidden");

  const list = bootstrap.pendingRequests || [];
  if (list.length === 0) {
    app.innerHTML = `<div class="center-msg">Hozircha kutayotgan so'rovlar yo'q.</div>`;
    return;
  }
  let html = "";
  list.forEach((r, idx) => {
    let eskiText = "";
    try {
      const eski = JSON.parse(r.eski);
      const defs = FORM_DEFS[r.jarayon] || [];
      eskiText = defs.filter(f => eski[f.k]).map(f => `${f.label}: ${eski[f.k]}`).join(" · ");
    } catch (e) { /* ignore */ }
    html += `
      <div class="card" style="flex-direction:column; align-items:stretch; cursor:default;">
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span class="title">${r.jarayon}</span>
          <span style="font-size:12px; color:var(--tg-hint);">${r.vaqt}</span>
        </div>
        <div style="font-size:13px; margin-bottom:4px;">👤 ${r.soraganFio}</div>
        <div style="font-size:13px; color:var(--tg-hint); margin-bottom:4px;">Sabab: ${r.sabab || "-"}</div>
        <div style="font-size:12px; color:var(--tg-hint); margin-bottom:10px;">${eskiText}</div>
        <div style="display:flex; gap:10px;">
          <button data-idx="${idx}" data-decision="approve" class="reviewBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:var(--accent-ok); color:#fff; font-weight:600;">Tasdiqlash</button>
          <button data-idx="${idx}" data-decision="reject" class="reviewBtn" style="flex:1; padding:10px; border:none; border-radius:8px; background:var(--accent-danger); color:#fff; font-weight:600;">Rad etish</button>
        </div>
      </div>
    `;
  });
  app.innerHTML = html;
  document.querySelectorAll(".reviewBtn").forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      const decision = btn.dataset.decision;
      const r = list[idx];
      if (!confirm((decision === "approve" ? "Tasdiqlaysizmi" : "Rad etasizmi") + "? (" + r.jarayon + ", " + r.soraganFio + ")")) return;
      btn.disabled = true;
      const res = await apiPost({ action: "reviewEditRequest", telegramId, reqId: r.reqId, decision });
      if (res.ok) {
        bootstrap.pendingRequests = bootstrap.pendingRequests.filter(x => x.reqId !== r.reqId);
        renderAdminPanel();
      } else {
        alert(res.error || "Xatolik");
        btn.disabled = false;
      }
    };
  });
}

init();
</script>
